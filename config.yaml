# admuter runtime configuration.
# Every tunable in the system lives here. Unknown keys are rejected at startup,
# so a typo fails loudly instead of silently keeping the default.

audio:
  # ALSA device for the Cubilux USB SPDIF receiver (USB 0c76:1170).
  # `arecord -L` lists these; PortAudio also matches on the bare card name.
  device: "plughw:CARD=Receiver,DEV=0"
  sample_rate: 48000
  channels: 2
  # Analysis window. 1.0s keeps us inside the 1-2s mute latency budget.
  window_seconds: 1.0
  # Sub-window frame size for silence detection. Must be small enough to see a
  # 0.2s gap inside a 1s window.
  frame_seconds: 0.05
  # Reconnect backoff when the device disappears (TV off, cable pulled).
  retry_initial_seconds: 1.0
  retry_max_seconds: 30.0

detection:
  # A frame quieter than this counts as near-silence.
  silence_dbfs: -50.0

  # --- Transition cue: short silent gap followed by an abrupt shift ---
  require_transition_cue: true    # false = ad profile alone can fire (riskier)
  min_gap_seconds: 0.15
  max_gap_seconds: 2.5
  cue_grace_seconds: 20.0          # how long a cue stays armed after the gap
  loudness_jump_db: .5           # |dBFS change| across the gap
  centroid_shift_ratio: 0.10

  # --- Ad profile, relative to the trailing content baseline ---
  # Tuned on the jungle-movie recording (3 breaks); see README "Tuning".
  # 3.0 is the bottom of the zero-false-mute range: 2.5 and below re-introduced
  # false mutes, 4.0 only cost coverage. 3.0-3.5 scored identically.
  ad_loudness_delta_db: 2.0
  # Hysteresis "stay" threshold. Entering an ad needs the full
  # ad_loudness_delta_db over the baseline; once in one, the loudness delta only
  # has to clear this lower bar to keep the ad alive, so a quieter spot or a soft
  # passage mid-break does not read as content and unmute early. The crest test
  # is unchanged. Omit it and it defaults to ad_loudness_delta_db - 2.0. Must be
  # <= ad_loudness_delta_db.
  ad_stay_loudness_delta_db: 0.0
  # Re-enabled. The old -99 (disabled) was fitted to the jungle movie, which is
  # the one session where crest looks inert -- and it was judged on RAW crest_db
  # (AUC 0.498 there) rather than on the delta this key actually thresholds.
  # Measured on the delta across all five sessions the direction is consistent
  # and useful: AUC 0.530 jungle, 0.550 new-girl, 0.741 schitts, 0.572
  # modern-family, 0.622 kardashians.
  #
  # Swept -99 through 3.0 under scripts/sweep_loso.py, judged on the WORST
  # session rather than the average. Minimising false mute alone is degenerate
  # -- at 2.0 and above the detector catches 2 of 25 breaks and mutes almost
  # nothing, which scores beautifully and does nothing. The rule used instead:
  # keep worst-session recall above 50%, then take the lowest false mute.
  #
  #   value  worst false mute/content hr  breaks  worst recall
  #   -99            2097s                24/25       57%
  #    -3            1488s                23/25       47%
  #    -1             835s                18/25       53%
  #     0             537s                15/25       32%
  #
  # -1.0 is that pick. It cuts the worst session (kardashians) from muting 58%
  # of its content to 23% while worst-case recall holds. The cost is real and
  # is not hidden: 24/25 breaks becomes 18/25, and the movie drops from 88% to
  # 54% recall. If missing whole breaks bothers you more than muted dialogue,
  # -3.0 is the conservative pick -- recall stays near intact everywhere and it
  # still cuts kardashians by 29%.
  ad_crest_delta_db: -1.0

  # --- Ad profile, absolute ---
  # Set, so the loudness half of the profile is judged against a fixed dBFS bar
  # rather than the baseline delta above. The delta measure defeats itself on
  # long breaks: baseline_alpha is an EMA over recent audio, so two minutes into
  # a break the baseline has climbed to meet the ad and the delta decays toward
  # zero while the ad is still playing. That is what produced 836s/hr of false
  # mute and "catches" with -150s latency (a spurious mute that happened to still
  # be open when the break arrived).
  #
  # Was -23.0, picked from the per-window features of the first three sessions
  # (best split -23.5 / -23.0 / -23.5 independently). Retuned to -22.0 once
  # ad_crest_delta_db was re-enabled: with crest rejecting dynamic content, the
  # loudness bar no longer has to do that job alone and can afford to tighten.
  # At -22.0 the worst session improves on BOTH axes against -23.0 -- 792s vs
  # 835s false mute per content hour, and 21 of 25 breaks vs 18. Tighter fails:
  # -21.5 drops worst-session recall to 39%, -21.0 to 23%.
  #
  # Still assumes a stable capture level. S/PDIF PCM out is a fixed digital
  # level so TV volume does not move it, but a different adapter or receiver
  # would -- and every number in this section would move with it.
  ad_absolute_dbfs: -22.0
  # Hysteresis partner, swept separately against the new enter bar. The 3 dB gap
  # beat the 2 dB default: -24.0 drops worst-session recall to 35%, -26.0 raises
  # false mute to 996s for no recall gain at all.
  ad_stay_absolute_dbfs: -25.0
  # Median of the trailing N windows before the absolute test. Raw per-window
  # loudness puts 54% of content inside the ad range; at 9 windows that is 17%,
  # because ads come in contiguous blocks and content spikes do not. Swept
  # 3/5/9/15/21: 9 was the only setting holding 11/11 breaks at 89% coverage,
  # and past ~15 the median starts straddling break boundaries and decays again.
  # Re-checked at 5/9/15 after crest was re-enabled. 15 now scores marginally
  # lower false mute (680s vs 792s worst session) but catches one break fewer
  # and pushes worst-case latency from +64s to +101s. That gap sits inside the
  # noise this corpus supports -- 25 breaks, and recall is not monotonic in any
  # of these knobs -- so 9 stays, on break count and latency rather than on the
  # headline number.
  loudness_median_windows: 9

  # --- Phase 2 voter: SHADOW MODE ---
  # The model runs on every window and its opinion is written to
  # logs/features.jsonl as ml_probability / ml_says_ad / heuristic_says_ad /
  # voters_disagree. It CANNOT move the mute decision while ml_vote_enabled is
  # false, and it should stay false: leave-one-session-out puts this model at
  # 0.673 mean AUC and 0.451 on kardashians -- below chance on the genre that
  # needs the most help -- and every voting threshold scored worse end to end
  # than the heuristic alone. It is here to collect disagreement data against
  # live audio, including services never annotated, at no risk to the decision.
  #
  # ml_threshold only bites once the vote is enabled. 0.85 is where this model
  # emits almost nothing, so enabling the vote here catches 0 of 25 breaks: the
  # AND-to-enter rule turns a silent model into a veto on everything.
  ml_model_path: "models/admuter.joblib"
  ml_vote_enabled: false
  ml_threshold: 0.85

  # --- Transcript voter: OFF ---
  # Ad copy is formulaic and some of it is legally mandated -- a pharma spot has
  # to say "tell your doctor", an offer has to say "restrictions apply". Those
  # phrases do not occur in scripted dialogue, and unlike every other signal
  # here they do not stop working when the show is as loud as its ads. That is
  # the whole point: it is the first feature in this system that is not loudness.
  #
  # It votes only on STAY, never on entry. Recognition lags the audio by 10-20s,
  # so by the time the words are scored the moment to start a mute is long gone;
  # entering on it would mute the show a quarter-minute after the break ended.
  # Holding a mute open through the middle of a break is what it is good for.
  #
  # Needs vosk plus a model, neither of which is in requirements.txt:
  #   pip install -r requirements-asr.txt
  #   wget https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
  #   unzip vosk-model-small-en-us-0.15.zip -d models/
  # then set the path below. Empty means no ASR thread is started at all.
  #
  # asr_threshold is a summed phrase weight, not a probability. asr_min_phrases
  # is the guard against a medical drama saying "tell your doctor": one phrase
  # is a coincidence and scores nothing, two or more is ad copy.
  asr_model_path: ""
  asr_vote_enabled: false
  asr_threshold: 3.0
  asr_decay_seconds: 30.0
  asr_min_phrases: 2

  # --- Content baseline (exponential moving average, one step per window) ---
  # Left at 0.05 deliberately. Offline, delta_rms AUC improves monotonically as
  # alpha drops (0.574 at 0.05 -> 0.673 at 0.005), but end-to-end it gets worse:
  # a sluggish baseline stays stale under loud content and fires spurious mutes
  # (0.02 -> 23s false, 0.005 -> 61s). Better window separation, worse system.
  baseline_alpha: 0.01            # ~20s time constant at 1s windows
  baseline_min_windows: 30        # refuse to fire before the baseline settles

  # --- Ad lifetime ---
  # These breaks are several spots with silent seams between them; at 2 the
  # detector read each seam as content and unmuted mid-break (24% coverage).
  # 5 and 6 are a zero-false-mute valley (50%/51%); 4 and below leak a spurious
  # mute after the break, 8+ overhang into returning dialogue (18s at 8, 53s
  # at 10). This is a narrow valley on one recording -- re-check it on new data.
  ad_end_windows: 6
  min_ad_seconds: 5.0             # anti-flap floor
  # Was 120, which is shorter than a real break here (the longest labelled break
  # is 158s), so the failsafe would have unmuted for its last 37s. 200 clears
  # the longest observed break with margin and still bounds a stuck detector.
  max_ad_seconds: 200.0           # detector failsafe: force AD_ENDED

controller:
  # Was 1, which meant a single ad-like second could mute the TV -- the source of
  # the pile of exactly-6s spurious mutes in the old scores (1 trigger + the 5s
  # min_ad_seconds hold). Safe to raise now that the absolute profile no longer
  # needs a lucky single window to fire. Trades latency for false mute almost
  # linearly and holds 11/11 breaks throughout: 3 -> +7s / 326s per hour,
  # 5 -> +9s / 304s, 8 -> +12s / 267s, 12 -> +16s / 223s. Raise it if false mutes
  # bother you more than hearing the first few seconds of an ad.
  confirm_windows: 5              # ad-like windows required before muting
  max_mute_seconds: 210.0         # hard failsafe; must be >= max_ad_seconds
  app_check_seconds: 10.0         # how often to ask the Roku what app is up

roku:
  host: "192.168.0.12"
  port: 8060
  timeout_seconds: 2.0
  # Detection only runs while one of these apps is on screen. Keep this on: it
  # is a safety gate, not a Netflix preference. Unarmed, the detector mutes
  # against anything the TV plays -- Spotify (loud, compressed, reads as ad
  # audio almost continuously), a console on HDMI, live TV, screensavers -- none
  # of which it was tuned on and none of which have ad breaks to catch.
  #
  # IDs came from this TV: curl http://192.168.0.12:8060/query/apps
  # Run that again after installing an app; ids are per-device for sideloads and
  # stable for store channels. Names are a fallback match, case-insensitive, so
  # the gate still works if an id changes under us.
  armed_apps_only: true
  armed_app_ids:
    - "12"        # Netflix          (ad tier)
    - "2285"      # Hulu
    - "13"        # Prime Video
    - "593099"    # Peacock TV
    - "61322"     # HBO Max          (ad tier)
    - "31440"     # Paramount Plus   (ad tier)
    - "291097"    # Disney Plus      (ad tier)
    - "151908"    # The Roku Channel (free, ad-supported)
  armed_app_names:
    - "Netflix"
    - "Hulu"
    - "Prime Video"
    - "Peacock TV"
    - "HBO Max"
    - "Paramount Plus"
    - "Disney Plus"
    - "The Roku Channel"
  # Deliberately NOT armed, all installed on this TV:
  #   837 YouTube, 195316 YouTube TV -- ad structure is nothing like a TV break
  #     (short pre-rolls, skippable) and min/max_ad_seconds do not fit it.
  #   22297 Spotify Music -- mastered as loud as any ad; it would mute constantly.
  #   261472 MGM+, 551012 Apple TV -- effectively ad-free, so every mute there
  #     would be a false one and there is nothing to catch in return.
  #   tvinput.* (HDMI 1-3, AV, Live TV), 123095 Aquatic Life, 773622 Backdrops.
  # VolumeMute is a toggle with no state query. Set true only if the TV is
  # already muted when the service starts.
  assume_muted_at_start: false

logging:
  level: "INFO"
  # Phase 2 training data: one row per window.
  feature_log_enabled: true
  feature_log_path: "logs/features.jsonl"
  feature_log_format: "jsonl"     # jsonl | csv
  verbose_decisions: false        # true = one INFO line per window, always
  decision_heartbeat_windows: 60  # steady-state INFO line every N windows (0 = off)
